<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshLink Admin</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f141c; --card:#171d27; --fg:#e6e9ef; --muted:#98a2b3; --line:#2a3240; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 16px; } h2 { font-size:15px; margin:0 0 12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
  input, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  textarea { width:100%; min-height:180px; font-family:ui-monospace, monospace; font-size:13px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; } button.ghost { background:transparent; color:var(--bad); border:1px solid var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .muted { color:var(--muted); } code { font-family:ui-monospace, monospace; }
  #msg { min-height:20px; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>MeshLink Admin</h1>
  <section>
    <div class="row">
      <input id="token" type="password" placeholder="Admin token" style="flex:1;min-width:220px">
      <button onclick="saveToken()">Connect</button>
    </div>
    <p id="msg" class="muted"></p>
  </section>

  <section>
    <h2>Server</h2>
    <div id="srv" class="muted">—</div>
    <div class="row" style="margin-top:8px">
      <input id="manualip" placeholder="Public IP override (only if router has no UPnP)" style="flex:1;min-width:220px">
      <button onclick="setManualIp()">Save</button>
      <button onclick="loadServer(true)">Re-check router</button>
    </div>
  </section>

  <section>
    <h2>Devices</h2>
    <table><thead><tr><th>Status</th><th>Name</th><th>Mesh IP</th><th>OS</th><th>Tags</th><th>RDP</th><th>Path</th><th></th></tr></thead>
    <tbody id="nodes"></tbody></table>
  </section>

  <section>
    <h2>Create auth key</h2>
    <div class="row">
      <input id="kdesc" placeholder="Description">
      <input id="ktags" placeholder="Tags, e.g. staff,office">
      <input id="kttl" type="number" value="24" style="width:90px" title="Validity in hours">
      <label><input id="kreuse" type="checkbox"> Reusable</label>
      <label><input id="keph" type="checkbox"> Ephemeral</label>
      <button onclick="createKey()">Generate</button>
    </div>
    <p id="newkey"></p>
    <pre id="joincmd" style="white-space:pre-wrap;word-break:break-all;font-size:12px"></pre>
  </section>

  <section>
    <h2>Access control policy</h2>
    <p class="muted">Selectors: <code>*</code>, <code>tag:name</code>, node name, IP or CIDR. Ports: <code>*</code>, <code>rdp</code>, <code>ssh</code>, <code>3389</code>, <code>udp:53</code>, <code>1000-2000</code>.</p>
    <textarea id="acl"></textarea>
    <div class="row" style="margin-top:8px"><button onclick="saveAcl()">Save policy</button></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = '';
  try { token = sessionStorage.getItem('ml_token') || ''; } catch (e) {}
  $('token').value = token;

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const msg = (t, bad) => { $('msg').textContent = t; $('msg').style.color = bad ? 'var(--bad)' : ''; };

  async function api(method, path, body) {
    const r = await fetch('/api/v1/admin' + path, { method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    return r.json();
  }

  function saveToken() { token = $('token').value.trim(); try { sessionStorage.setItem('ml_token', token); } catch (e) {} load(true); loadServer(); }

  async function load(withAcl) {
    if (!token) return msg('Enter the admin token to continue.');
    try {
      const nodes = await api('GET', '/nodes');
      $('nodes').innerHTML = nodes.map((n) => `<tr>
        <td><span class="dot" style="background:${n.online ? 'var(--ok)' : 'var(--muted)'}"></span>${n.online ? 'Online' : 'Offline'}</td>
        <td>${esc(n.name)}<div class="muted">${esc(n.fqdn)}</div></td><td><code>${esc(n.ip)}</code></td><td>${esc(n.os)}</td>
        <td><input value="${esc(n.tags.join(','))}" onchange="setTags(${n.id}, this.value)" style="width:140px"></td>
        <td>${n.rdp_enabled ? 'Enabled' : '—'}</td><td>${n.endpoint ? 'Direct' : 'Relay'}</td>
        <td><button class="ghost" onclick="delNode(${n.id}, '${esc(n.name)}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No devices yet.</td></tr>';
      if (withAcl) $('acl').value = JSON.stringify(await api('GET', '/acl'), null, 2);
      msg(`Connected. ${nodes.length} device(s).`);
    } catch (e) { msg(e.message, true); }
  }

  let srv = {};
  async function loadServer(refresh) {
    try {
      srv = await api('GET', '/server-info' + (refresh ? '?refresh=true' : ''));
      const rows = [
        ['Public IP', srv.public_ip ? `<code>${esc(srv.public_ip)}</code>${srv.public_ip_manual ? ' (manual)' : ' (from router)'}` : '<span style="color:var(--bad)">unknown</span>'],
        ['Office LAN IP', `<code>${esc(srv.lan_ip || 'unknown')}</code>`],
        ['Ports to forward on router', `UDP ${srv.wg_port} (WireGuard), TCP ${srv.api_port} (API)`],
        ['Router UPnP', esc(srv.upnp_status || 'not checked yet')],
        ['Certificate fingerprint', `<code style="word-break:break-all">${esc(srv.tls_fingerprint)}</code>`],
        ['Hub mesh IP', `<code>${esc(srv.hub_ip)}</code> (RDP to the server itself)`],
      ];
      if (srv.public_ip_warning) rows.unshift(['Warning', `<span style="color:var(--bad)">${esc(srv.public_ip_warning)}</span>`]);
      $('srv').innerHTML = '<table>' + rows.map(([k, v]) => `<tr><th style="width:220px">${k}</th><td style="white-space:normal">${v}</td></tr>`).join('') + '</table>';
    } catch (e) { msg(e.message, true); }
  }
  async function setManualIp() { try { await api('PUT', '/server-info', { public_ip: $('manualip').value.trim() || null }); loadServer(); msg('Saved.'); } catch (e) { msg(e.message, true); } }
  function serverList() {
    return [srv.lan_ip, srv.public_ip].filter(Boolean).map((ip) => `https://${ip}:${srv.api_port}`).join(',');
  }

  async function setTags(id, v) { try { await api('PATCH', `/nodes/${id}`, { tags: v.split(',').map((t) => t.trim()).filter(Boolean) }); msg('Tags updated.'); } catch (e) { msg(e.message, true); } }
  async function delNode(id, name) { if (confirm(`Remove ${name} from the network?`)) { try { await api('DELETE', `/nodes/${id}`); load(); } catch (e) { msg(e.message, true); } } }
  async function createKey() {
    try {
      const k = await api('POST', '/authkeys', { description: $('kdesc').value, tags: $('ktags').value.split(',').map((t) => t.trim()).filter(Boolean),
        ttl_hours: Number($('kttl').value) || null, reusable: $('kreuse').checked, ephemeral: $('keph').checked });
      $('newkey').innerHTML = `Auth key (shown once): <code>${esc(k.authkey)}</code>`;
      const servers = serverList();
      $('joincmd').textContent =
        `Windows (elevated PowerShell, add -EnableRdp for PCs you want to RDP into):\n` +
        `.\\install-agent-windows.ps1 -Server "${servers}" -Fingerprint ${srv.tls_fingerprint} -AuthKey ${k.authkey}\n\n` +
        `Linux / macOS:\nsudo meshlink up --server "${servers}" --fingerprint ${srv.tls_fingerprint} --authkey ${k.authkey}`;
    } catch (e) { msg(e.message, true); }
  }
  async function saveAcl() { try { await api('PUT', '/acl', JSON.parse($('acl').value)); msg('Policy saved.'); } catch (e) { msg(e.message, true); } }

  load(true); if (token) loadServer(); setInterval(() => token && load(), 15000);
</script>
</body>
</html>
