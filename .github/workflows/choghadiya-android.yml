name: Choghadiya Android APK

on:
  push:
    paths:
      - "choghadiya-android/**"
      - ".github/workflows/choghadiya-android.yml"
  pull_request:
    paths:
      - "choghadiya-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choghadiya-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Default list includes the removed legacy "tools" package; install only what the build needs.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Download Gradle distribution (retries transient download errors)
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in $((i * 20)) s"
            sleep $((i * 20))
          done
          exit 1
      - name: Unit tests, UI smoke tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: choghadiya-debug-apk
          path: choghadiya-android/app/build/outputs/apk/debug/app-debug.apk
