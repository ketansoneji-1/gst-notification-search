name: Choghadiya Android APK

on:
  push:
    paths:
      - "choghadiya-android/**"
      - ".github/workflows/choghadiya-android.yml"
  pull_request:
    paths:
      - "choghadiya-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choghadiya-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: choghadiya-debug-apk
          path: choghadiya-android/app/build/outputs/apk/debug/app-debug.apk
